name: Deploy to MonsterASP

on:
  push:
    branches:
      - main 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Update appsettings.json with Secrets
      uses: microsoft/variable-substitution@v1
      with:
        files: '**/appsettings.json'
      env:
        ConnectionStrings.sqlConnection: ${{ secrets.SQLCONNECTION }}
        ConnectionStrings.placeConnection: ${{ secrets.PLACECONNECTION }}
        AppSettings.JWTSecret: ${{ secrets.JWTSECRET }}
        EmailConfiguration.Username: ${{ secrets.EMAILUSERNAME }}
        EmailConfiguration.Password: ${{ secrets.EMAILPASSWORD }}
    # ----------------------------

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x' 

    - name: Restore dependencies
      run: dotnet restore

    - name: Build project
      run: dotnet build --configuration Release --no-restore

    - name: Publish project
      run: dotnet publish --configuration Release --output ./publish

    - name: Sync files via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./publish/
        server-dir: /wwwroot/
